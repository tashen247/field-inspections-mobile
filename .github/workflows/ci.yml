name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fim
          POSTGRES_PASSWORD: fim
          POSTGRES_DB: fim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fim -d fim_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      localstack:
        image: localstack/localstack:4.9
        env:
          SERVICES: s3,sqs
          AWS_DEFAULT_REGION: af-south-1
        ports: ['4566:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 3s --health-timeout 5s --health-retries 40
    env:
      TEST_DATABASE_URL: postgres://fim:fim@localhost:5432/fim_test
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: af-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests with coverage
        run: pnpm test:coverage
      - name: Delta sync latency (5,000 inspections, p95 < 200 ms)
        run: pnpm --filter @fim/api bench:sync
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/worker/coverage
            packages/shared/coverage
            apps/mobile/coverage
          if-no-files-found: ignore

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm synth
